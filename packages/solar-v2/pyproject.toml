[project]
name = "solar-v2"
version = "0.1.0"
description = "solar-v2 — consume-xlsx-as-software workspace member"
requires-python = ">=3.13"
dependencies = [
    "xlsx-core",
    "polars>=1.0.0",
    "pyyaml>=6.0",
]

[tool.uv.sources]
xlsx-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solar_v2"]
