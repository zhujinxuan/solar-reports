[project]
name = "solar-v1"
version = "0.1.0"
description = "solar-v1 — consume-xlsx-as-software workspace member"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
    "xlsx-core",
]

[tool.uv.sources]
xlsx-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solar_v1"]
