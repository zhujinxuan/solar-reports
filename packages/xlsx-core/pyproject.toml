[project]
name = "xlsx-core"
version = "0.1.0"
description = "xlsx-core — consume-xlsx-as-software workspace member"
requires-python = ">=3.13"
dependencies = [
    "formulas>=1.3.4",
    "openpyxl>=3.1.5",
    "polars>=1.43.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pywin32>=312; sys_platform == 'win32'",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xlsx_core"]
