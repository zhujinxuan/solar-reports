[project]
name = "solar-cli"
version = "0.1.0"
description = "solar-cli — consume-xlsx-as-software workspace member"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.27.0",
    "xlsx-core",
    "solar-v1",
    "solar-v2",
]

[project.scripts]
solar-cli = "solar_cli.main:app"

[tool.uv.sources]
xlsx-core = { workspace = true }
solar-v1 = { workspace = true }
solar-v2 = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solar_cli"]
