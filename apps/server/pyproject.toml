[project]
name = "solar-server"
version = "0.1.0"
description = "solar-server — consume-xlsx-as-software workspace member"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.140.0",
    "uvicorn>=0.51.0",
    "xlsx-core",
    "solar-v1",
    "solar-v2",
    "httpx2>=2.9.1",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[tool.uv.sources]
xlsx-core = { workspace = true }
solar-v1 = { workspace = true }
solar-v2 = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solar_server"]
